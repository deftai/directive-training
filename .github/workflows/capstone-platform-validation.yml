name: capstone-platform-validation

on:
  pull_request:
    paths:
      - ".github/workflows/capstone-platform-validation.yml"
      - "labs/fixtures/capstone-end-to-end/**"
      - "scripts/capstone-lab.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-capstone-proof:
    name: ${{ matrix.proof }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: macos-node24
            os: macos-15
          - proof: linux-node24
            os: ubuntu-24.04
          - proof: windows-node24
            os: windows-2022
    steps:
      - name: Check out authored training source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Select uv 0.11.10
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.10"
          enable-cache: false

      - name: Select Python 3.13.13 for Directive verification
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.13"
          check-latest: false

      - name: Select Task 3.50.0
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: "3.50.0"

      - name: Exercise the guarded no-remote capstone
        run: node --test scripts/capstone-lab.test.mjs
