name: modules-2-3-platform-validation

on:
  pull_request:
    paths:
      - ".github/workflows/modules-2-3-platform-validation.yml"
      - "curriculum/modules/02-installation-and-anatomy.md"
      - "labs/02-disposable-initialization.md"
      - "labs/fixtures/02-disposable-initialization/package.json"
      - "solutions/lab-02-disposable-initialization.md"
      - "references/SOURCE-NOTES.md"
permissions:
  contents: read

env:
  GH_NO_UPDATE_NOTIFIER: "1"

jobs:
  disposable-consumer-proof:
    name: ${{ matrix.proof }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: macos-zsh
            os: macos-15
          - proof: linux-bash
            os: ubuntu-24.04
          - proof: windows-pwsh7
            os: windows-2022
    steps:
      - name: Check out authored training source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      - name: Prove the disposable consumer path on macOS with zsh
        if: matrix.proof == 'macos-zsh'
        shell: zsh {0}
        run: |
          set -eu
          set -o pipefail
          runner_root="$(cd "$RUNNER_TEMP" && pwd -P)"
          lab_parent="$(mktemp -d "$runner_root/3ci-directive-module-02.XXXXXX")"
          lab_parent="$(cd "$lab_parent" && pwd -P)"
          case "$lab_parent" in
            "$runner_root"/3ci-directive-module-02.*) ;;
            *) echo "unsafe lab parent: $lab_parent" >&2; exit 2 ;;
          esac

          ancestor="$lab_parent"
          while :
          do
            test ! -e "$ancestor/.git" || { echo "temporary parent is inside another Git repository" >&2; exit 2; }
            test "$ancestor" = / && break
            ancestor="$(dirname "$ancestor")"
          done

          assert_lab_root() {
            test "$(pwd -P)" = "$lab_root"
            case "$lab_root" in
              "$lab_parent"/attempt-*) ;;
              *) echo "unsafe lab root: $lab_root" >&2; return 2 ;;
            esac
          }

          assert_no_remote() {
            assert_lab_root || return 2
            test -e .git || return 2
            git_root="$(git rev-parse --show-toplevel)" || return 2
            git_root="$(cd "$git_root" && pwd -P)" || return 2
            test "$git_root" = "$lab_root" || return 2
            remote_output="$(git remote)" || return 2
            test -z "$remote_output"
          }

          lab_root="$(mktemp -d "$lab_parent/attempt-01.XXXXXX")"
          lab_root="$(cd "$lab_root" && pwd -P)"
          cd "$lab_root"
          assert_lab_root
          git init --initial-branch=main
          git switch -c training/module-02
          assert_no_remote

          cd "$lab_parent"
          lab_root="$(mktemp -d "$lab_parent/attempt-02.XXXXXX")"
          lab_root="$(cd "$lab_root" && pwd -P)"
          cd "$lab_root"
          assert_lab_root
          git init --initial-branch=main
          git switch -c training/module-02
          assert_no_remote
          cp "$GITHUB_WORKSPACE/labs/fixtures/02-disposable-initialization/package.json" package.json
          printf 'node_modules/\n/.npm-cache/\n/USER.md\n/.deft/USER.md\n' > .gitignore
          printf 'registry=https://registry.npmjs.org/\naudit=false\nfund=false\nignore-scripts=true\n' > .npmrc
          node -e 'const p=require("./package.json"); const o=p.overrides||{}; if(p.private!==true || p.devDependencies?.["@deftai/directive"]!=="0.119.5" || ["@deftai/directive-content","@deftai/directive-core","@deftai/directive-types"].some((n)=>o[n]!=="0.119.5")) process.exit(2)'

          env -i PATH="$PATH" HOME="$HOME" npm install --userconfig "$lab_root/.npmrc" --globalconfig /dev/null --cache "$lab_root/.npm-cache" --ignore-scripts --no-audit --no-fund
          assert_no_remote
          local_bin="$lab_root/node_modules/.bin"
          export PATH="$local_bin:$PATH"
          hash -r
          resolved_deft="$(command -v deft)"
          test "$resolved_deft" = "$local_bin/deft"
          directive_path="$local_bin/directive"
          test -x "$directive_path"
          test -x "$local_bin/deft"
          node -e 'for (const n of ["@deftai/directive","@deftai/directive-content","@deftai/directive-core","@deftai/directive-types"]) { if(require("./node_modules/"+n+"/package.json").version!=="0.119.5") process.exit(2) }'
          version_output="$("$directive_path" --version)"
          case "$version_output" in
            *'@deftai/directive-core@0.119.5'*) ;;
            *) echo "wrong Directive version" >&2; exit 2 ;;
          esac
          "$directive_path" --help >/dev/null
          "$directive_path" commands >/dev/null
          "$directive_path" init --help >/dev/null
          "$directive_path" update --help >/dev/null
          "$directive_path" doctor --help >/dev/null
          set +e
          "$directive_path" toolchain:check --help >"$lab_parent/toolchain-help.txt" 2>&1
          toolchain_help_exit=$?
          set -e
          test "$toolchain_help_exit" -eq 2
          grep -F 'unrecognized argument: --help' "$lab_parent/toolchain-help.txt"

          assert_no_remote
          "$directive_path" init --yes --repo-root .
          assert_no_remote
          for required_tracked_path in AGENTS.md Taskfile.yml .deft/GENERATION.json .githooks/pre-commit .npmrc xbrief/PROJECT-DEFINITION.xbrief.json
          do
            test -f "$required_tracked_path"
          done
          node -e 'const g=require("./.deft/GENERATION.json"); if(g.contentVersion!=="0.119.5" || g.surfaces?.payload!=="0.119.5") process.exit(2)'
          node -e 'const x=require("./xbrief/PROJECT-DEFINITION.xbrief.json"); if(x.xBRIEFInfo?.version!=="0.8") process.exit(2)'
          test "$(git config --get core.hooksPath)" = ".githooks"
          for ignored_path in .deft/core/VERSION .deft/.cli/example .deft-cache/example .deft/ritual-state.json xbrief/.triage-cache/candidates.jsonl USER.md .npm-cache/example node_modules/example
          do
            git check-ignore -q -- "$ignored_path"
          done

          trackable_files="$lab_parent/trackable-files.txt"
          {
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u >"$trackable_files"
          test -s "$trackable_files"
          while IFS= read -r relative_path
          do
            case "$relative_path" in
              .agents/*|.claude/*|.codex/*|.cursor/*|.deft/GENERATION.json|.deft/approved-scope/*|.gitattributes|.githooks/*|.github/*|.gitignore|.grok/*|.npmrc|.prettierignore|AGENTS.md|Taskfile.yml|greptile.json|package.json|package-lock.json|xbrief/*) ;;
              *) echo "unexpected trackable path: $relative_path" >&2; exit 2 ;;
            esac
          done <"$trackable_files"
          git add --pathspec-from-file="$trackable_files"
          for required_tracked_path in AGENTS.md Taskfile.yml .deft/GENERATION.json .githooks/pre-commit .npmrc xbrief/PROJECT-DEFINITION.xbrief.json
          do
            git ls-files --error-unmatch -- "$required_tracked_path" >/dev/null
          done
          git config user.name 'Northstar Training Learner'
          git config user.email 'learner@northstar.invalid'
          test "$(command -v deft)" = "$local_bin/deft"
          git commit -m 'checkpoint: initialize fictional Directive consumer'

          # Capture doctor output and assert the expected 0.119.5 warning identity set (#19).
          doctor_output="$lab_parent/doctor-full.txt"
          "$directive_path" doctor --full --project-root . >"$doctor_output" 2>&1
          cat "$doctor_output"
          node "$GITHUB_WORKSPACE/scripts/assert-doctor-warning-set.mjs" "$doctor_output"
          "$directive_path" toolchain:check --consumer --project-root .
          node -e 'const p=require("./package.json"); const o=p.overrides||{}; if(p.private!==true || p.devDependencies?.["@deftai/directive"]!=="0.119.5" || ["@deftai/directive-content","@deftai/directive-core","@deftai/directive-types"].some((n)=>o[n]!=="0.119.5")) process.exit(2)'
          node -e 'for (const n of ["@deftai/directive","@deftai/directive-content","@deftai/directive-core","@deftai/directive-types"]) { if(require("./node_modules/"+n+"/package.json").version!=="0.119.5") process.exit(2) }'
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"
          git check-ignore -q -- .deft/core/VERSION
          test "$(git branch --show-current)" = training/module-02
          assert_no_remote

          cd "$runner_root"
          archive_root="$(mktemp -d "$runner_root/3ci-directive-module-02-archive.XXXXXX")"
          archive_target="$archive_root/lab-parent"
          test ! -e "$archive_target"
          mv -- "$lab_parent" "$archive_target"
          test ! -e "$lab_parent"
          attempt_count=0
          for archived_attempt in "$archive_target"/attempt-*
          do
            test -e "$archived_attempt/.git"
            archived_git_root="$(git -C "$archived_attempt" rev-parse --show-toplevel)"
            archived_git_root="$(cd "$archived_git_root" && pwd -P)"
            test "$archived_git_root" = "$(cd "$archived_attempt" && pwd -P)"
            archived_remotes="$(git -C "$archived_attempt" remote)"
            test -z "$archived_remotes"
            attempt_count=$((attempt_count + 1))
          done
          test "$attempt_count" -eq 2

      - name: Prove the disposable consumer path on Linux with bash
        if: matrix.proof == 'linux-bash'
        shell: bash
        run: |
          set -euo pipefail
          runner_root="$(cd "$RUNNER_TEMP" && pwd -P)"
          lab_parent="$(mktemp -d "$runner_root/3ci-directive-module-02.XXXXXX")"
