            test -e .git || return 2
            git_root="$(git rev-parse --show-toplevel)" || return 2
            git_root="$(cd "$git_root" && pwd -P)" || return 2
            test "$git_root" = "$lab_root" || return 2
            remote_output="$(git remote)" || return 2
            test -z "$remote_output"
