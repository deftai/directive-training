name: modules-2-3-platform-validation

on:
  pull_request:
    paths:
      - ".github/workflows/modules-2-3-platform-validation.yml"
      - "curriculum/modules/02-installation-and-anatomy.md"
      - "labs/02-disposable-initialization.md"
      - "labs/fixtures/02-disposable-initialization/**"
      - "scripts/init-lab.test.mjs"
      - "solutions/lab-02-disposable-initialization.md"
      - "references/SOURCE-NOTES.md"
permissions:
  contents: read

env:
  GH_NO_UPDATE_NOTIFIER: "1"

jobs:
  disposable-consumer-proof:
    name: ${{ matrix.proof }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: macos-zsh
            os: macos-15
          - proof: linux-bash
            os: ubuntu-24.04
          - proof: windows-pwsh7
            os: windows-2022
    steps:
      - name: Check out authored training source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          check-latest: false
          package-manager-cache: false

      # Each platform job runs the learner path the converted lab teaches: one course-relative
      # helper invoked per step with the single printed absolute attempt root, exactly as a
      # coding-agent host that starts a fresh shell per command block would (#18).
      - name: Prove the disposable consumer path on macOS with zsh
        if: matrix.proof == 'macos-zsh'
        shell: zsh {0}
        run: |
          set -eu
          set -o pipefail
          export DIRECTIVE_TRAINING_ROOT="$GITHUB_WORKSPACE"
          helper=""
          if test -n "${DIRECTIVE_TRAINING_ROOT:-}"; then
            helper="$DIRECTIVE_TRAINING_ROOT/labs/fixtures/02-disposable-initialization/init-lab.mjs"
          fi
          test -n "$helper" || { echo "Paste refusal: DIRECTIVE_TRAINING_ROOT is empty" >&2; exit 2; }
          test -f "$helper" || { echo "Paste refusal: no helper file at $helper" >&2; exit 2; }

          set +e
          refusal="$(node "$helper" guard "" 2>&1)"
          refusal_exit=$?
          set -e
          test "$refusal_exit" -ne 0
          case "$refusal" in
            *"Usage refusal"*) ;;
            *) echo "expected a usage refusal for a missing printed root: $refusal" >&2; exit 2 ;;
          esac
          case "$refusal" in
            *"Stop:"*) echo "a missing printed root must not read as a boundary stop" >&2; exit 2 ;;
          esac

          lab_root="$(node "$helper" create)"
          node "$helper" guard "$lab_root"
          lab_root="$(node "$helper" reset "$lab_root")"
          node "$helper" guard "$lab_root"
          node "$helper" install "$lab_root"

          local_bin="$lab_root/node_modules/.bin"
          directive_path="$local_bin/directive"
          test -x "$directive_path"
          test -x "$local_bin/deft"
          "$directive_path" --version
          test "$(git -C "$lab_root" log -1 --format=%s)" = 'checkpoint: initialize fictional Directive consumer'
          test "$(git -C "$lab_root" branch --show-current)" = training/module-02

          # Capture doctor output and assert the expected 0.119.5 warning identity set (#19).
          node "$helper" diagnose "$lab_root"
          doctor_output="$(dirname "$lab_root")/doctor-full.txt"
          cat "$doctor_output"
          node "$GITHUB_WORKSPACE/scripts/assert-doctor-warning-set.mjs" "$doctor_output"

          node "$helper" accept "$lab_root"
          node "$helper" recovery-npmrc "$lab_root"

          archived="$(node "$helper" archive "$lab_root")"
          archive_target="${archived#archived=}"
          attempt_count=0
          for archived_attempt in "$archive_target"/attempt-*
          do
            test -e "$archived_attempt/.git"
            test -z "$(git -C "$archived_attempt" remote)"
            attempt_count=$((attempt_count + 1))
          done
          test "$attempt_count" -eq 2

      - name: Prove the disposable consumer path on Linux with bash
        if: matrix.proof == 'linux-bash'
        shell: bash
        run: |
          set -euo pipefail
          export DIRECTIVE_TRAINING_ROOT="$GITHUB_WORKSPACE"
          helper=""
          if test -n "${DIRECTIVE_TRAINING_ROOT:-}"; then
            helper="$DIRECTIVE_TRAINING_ROOT/labs/fixtures/02-disposable-initialization/init-lab.mjs"
          fi
          test -n "$helper" || { echo "Paste refusal: DIRECTIVE_TRAINING_ROOT is empty" >&2; exit 2; }
          test -f "$helper" || { echo "Paste refusal: no helper file at $helper" >&2; exit 2; }

          set +e
          refusal="$(node "$helper" guard "" 2>&1)"
          refusal_exit=$?
          set -e
          test "$refusal_exit" -ne 0
          case "$refusal" in
            *"Usage refusal"*) ;;
            *) echo "expected a usage refusal for a missing printed root: $refusal" >&2; exit 2 ;;
          esac
          case "$refusal" in
            *"Stop:"*) echo "a missing printed root must not read as a boundary stop" >&2; exit 2 ;;
          esac

          lab_root="$(node "$helper" create)"
          node "$helper" guard "$lab_root"
          lab_root="$(node "$helper" reset "$lab_root")"
          node "$helper" guard "$lab_root"
          node "$helper" install "$lab_root"

          local_bin="$lab_root/node_modules/.bin"
          directive_path="$local_bin/directive"
          test -x "$directive_path"
          test -x "$local_bin/deft"
          "$directive_path" --version
          test "$(git -C "$lab_root" log -1 --format=%s)" = 'checkpoint: initialize fictional Directive consumer'
          test "$(git -C "$lab_root" branch --show-current)" = training/module-02

          # Capture doctor output and assert the expected 0.119.5 warning identity set (#19).
          node "$helper" diagnose "$lab_root"
          doctor_output="$(dirname "$lab_root")/doctor-full.txt"
          cat "$doctor_output"
          node "$GITHUB_WORKSPACE/scripts/assert-doctor-warning-set.mjs" "$doctor_output"

          node "$helper" accept "$lab_root"
          node "$helper" recovery-npmrc "$lab_root"

          archived="$(node "$helper" archive "$lab_root")"
          archive_target="${archived#archived=}"
          attempt_count=0
          for archived_attempt in "$archive_target"/attempt-*
          do
            test -e "$archived_attempt/.git"
            test -z "$(git -C "$archived_attempt" remote)"
            attempt_count=$((attempt_count + 1))
          done
          test "$attempt_count" -eq 2

      - name: Prove the disposable consumer path on Windows with PowerShell 7.4+
        if: matrix.proof == 'windows-pwsh7'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw "PowerShell 7.4 or newer is required" }
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DIRECTIVE_TRAINING_ROOT = $env:GITHUB_WORKSPACE
          $helper = ''
          if (-not [string]::IsNullOrWhiteSpace($env:DIRECTIVE_TRAINING_ROOT)) {
            $helper = Join-Path $env:DIRECTIVE_TRAINING_ROOT 'labs/fixtures/02-disposable-initialization/init-lab.mjs'
          }
          if ([string]::IsNullOrWhiteSpace($helper)) { throw "Paste refusal: DIRECTIVE_TRAINING_ROOT is empty" }
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw "Paste refusal: no helper file at $helper" }

          $PSNativeCommandUseErrorActionPreference = $false
          try {
            $refusal = (& node $helper guard '' 2>&1 | Out-String)
            $refusalExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          if ($refusalExit -eq 0) { throw "expected a nonzero exit for a missing printed root" }
          if ($refusal -notmatch 'Usage refusal') { throw "expected a usage refusal for a missing printed root: $refusal" }
          if ($refusal -match 'Stop:') { throw "a missing printed root must not read as a boundary stop" }

          $labRoot = (& node $helper create | Out-String).Trim()
          & node $helper guard $labRoot
          $labRoot = (& node $helper reset $labRoot | Out-String).Trim()
          & node $helper guard $labRoot
          & node $helper install $labRoot

          $localBin = [IO.Path]::GetFullPath((Join-Path $labRoot "node_modules/.bin"))
          $directivePath = [IO.Path]::GetFullPath((Join-Path $localBin "directive.cmd"))
          $deftPath = [IO.Path]::GetFullPath((Join-Path $localBin "deft.cmd"))
          if (-not (Test-Path -LiteralPath $directivePath -PathType Leaf)) { throw "project-local Directive CLI is missing" }
          if (-not (Test-Path -LiteralPath $deftPath -PathType Leaf)) { throw "project-local Deft hook runtime is missing" }
          $versionOutput = (& $directivePath --version | Out-String)
          if ($versionOutput -notmatch '@deftai/directive-core@0\.119\.5') { throw "wrong Directive version: $versionOutput" }
          $subject = (& git -C $labRoot log -1 --format=%s | Out-String).Trim()
          if ($subject -ne 'checkpoint: initialize fictional Directive consumer') { throw "unexpected checkpoint subject: $subject" }
          if ((& git -C $labRoot branch --show-current | Out-String).Trim() -ne 'training/module-02') { throw "wrong lab branch" }

          # Capture doctor output and assert the expected 0.119.5 warning identity set (#19).
          & node $helper diagnose $labRoot
          $doctorOutput = Join-Path (Split-Path -Parent $labRoot) "doctor-full.txt"
          Get-Content -LiteralPath $doctorOutput
          & node (Join-Path $env:GITHUB_WORKSPACE "scripts/assert-doctor-warning-set.mjs") $doctorOutput

          & node $helper accept $labRoot
          & node $helper recovery-npmrc $labRoot

          $archived = (& node $helper archive $labRoot | Out-String).Trim()
          $archiveTarget = $archived.Substring("archived=".Length)
          $archivedAttempts = @(Get-ChildItem -LiteralPath $archiveTarget -Directory | Where-Object { $_.Name -like "attempt-*" })
          if ($archivedAttempts.Count -ne 2) { throw "expected two archived attempts" }
          foreach ($archivedAttempt in $archivedAttempts) {
            if (-not (Test-Path -LiteralPath (Join-Path $archivedAttempt.FullName ".git"))) {
              throw "archived attempt lacks .git"
            }
            $archivedRemotes = @(git -C $archivedAttempt.FullName remote)
            if ($archivedRemotes.Count -ne 0) { throw "archived attempt has a remote" }
          }
