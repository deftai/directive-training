version: '3'

includes:
  deft:
    taskfile: ./.deft/core/Taskfile.yml
    optional: true

tasks:
  literal:
    desc: Run the active story's literal acceptance commands.
    cmds:
      - node node_modules/@deftai/directive/dist/bin.js verify:ac xbrief/active/fictional-summary.xbrief.json

  forward-coverage:
    desc: Check source-to-test correspondence and available changed-branch coverage.
    cmds:
      - node node_modules/@deftai/directive/dist/bin.js verify:forward-coverage --project-root . --head

  quality:record:
    desc: Verify the governed Module 11 quality record.
    cmds:
      - node scripts/verify-quality-record.mjs

  check:
    desc: Module 11 aggregate gate; repair work, never these commands.
    cmds:
      - npm run test:focused
      - task: literal
      - task: forward-coverage
      - task: quality:record
